<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 允许缩放，让用户能自己缩放查看，并适配刘海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
    <title>我的小手机</title>
    <style>
        /* 整个页面填满屏幕，禁止滚动 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
        }

        /* 
         * 核心改动：不再写死 390x844
         * 使用自适应缩放，保持手机比例
         */
        .phone-shell {
            width: 100%;
            height: 100%;
            max-width: 430px; /* 最大宽度，在平板上不会太大 */
            max-height: 932px; /* 最大高度 */
            background-color: #000;
            border-radius: 12vw; /* 手机圆角自适应 */
            padding: 1.5vw; /* 黑边厚度自适应 */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            box-sizing: border-box;
            /* 如果屏幕比例和手机不一致，自动按比例缩放 */
            aspect-ratio: 390 / 844;
            display: flex;
            flex-direction: column;
        }

        /* 顶部灵动岛，自适应位置 */
        .dynamic-island {
            position: absolute;
            top: 2.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 28%;
            height: 3.5%;
            background-color: #000;
            border-radius: 2vw;
            z-index: 100;
        }

        /* 屏幕区域 */
        .screen {
            width: 100%;
            height: 100%;
            background-color: #fff;
            border-radius: 10vw; /* 内屏圆角 */
            overflow: hidden;
            position: relative;
            flex: 1;
        }

        /* 核心：把 dawn.html 塞进屏幕里 */
        .app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 手机外壳开始 -->
    <div class="phone-shell">
        <!-- 灵动岛 -->
        <div class="dynamic-island"></div>
        
        <!-- 屏幕区域 -->
        <div class="screen" style="position: relative;">
            <!-- 桌面层 -->
            <div id="homeScreen" style="width: 100%; height: 100%;">
                <iframe class="app-frame" src="desktop.html"></iframe>
            </div>
            <!-- App运行层 -->
            <div id="appContainer" style="display: none; width: 100%; height: 100%;">
                <iframe class="app-frame" src="dawn.html"></iframe>
            </div>
        </div>
    </div>
    <!-- 手机外壳结束 -->

    <script src="script.js"></script>
    
    <script>
        // 每分钟给后台微信发送一次心跳，防止被浏览器休眠
        setInterval(() => {
            const appIframe = document.querySelector('#appContainer iframe');
            if (appIframe && appIframe.contentWindow) {
                appIframe.contentWindow.postMessage({ type: 'ping' }, '*');
            }
        }, 60000);
    </script>
</body>
</html>
