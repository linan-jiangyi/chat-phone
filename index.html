<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的小手机</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #d4d4d8; font-family: -apple-system, sans-serif; overflow: hidden; }
        .phone-shell { width: 390px; height: 844px; background-color: #000; border-radius: 45px; padding: 10px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25); position: relative; box-sizing: border-box; }
        .dynamic-island { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background-color: #000; border-radius: 20px; z-index: 100; }
        .screen { width: 100%; height: 100%; background-color: #f2f2f5; border-radius: 36px; overflow: hidden; position: relative; }
        .app-frame { width: 100%; height: 100%; border: none; display: block; }
        .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; background-color: rgba(0, 0, 0, 0.6); border-radius: 3px; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div class="phone-shell">
        <div class="dynamic-island"></div>
        <div class="screen" style="position: relative;">
            <!-- 桌面层 -->
            <div id="homeScreen" style="width: 100%; height: 100%;">
                <iframe class="app-frame" src="desktop.html"></iframe>
            </div>
            <!-- App运行层 -->
            <div id="appContainer" style="display: none; width: 100%; height: 100%;">
                <iframe class="app-frame" src="dawn.html"></iframe>
            </div>
        </div>
        <div class="home-indicator"></div>
    </div>
    
    <script src="script.js"></script>
    <script>
        // 每分钟给后台微信发送一次心跳，防止被浏览器休眠
        setInterval(() => {
            const appIframe = document.querySelector('#appContainer iframe');
            if (appIframe && appIframe.contentWindow) {
                appIframe.contentWindow.postMessage({ type: 'ping' }, '*');
            }
        }, 60000);
    </script>
</body>
</html>
