<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;overflow-x:hidden}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:#f2f2f7}
.ah{padding:24px 16px 10px;display:flex;align-items:center;gap:8px;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);border-bottom:.5px solid rgba(0,0,0,.1);flex-shrink:0;min-height:90px;position:relative;z-index:10}
.ah .b{width:40px;height:34px;border-radius:50%;background:transparent;display:grid;place-items:center;font-size:26px;color:#007aff;cursor:pointer;border:none;flex-shrink:0}
.ah .ti{font-size:17px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1c1c1e}
.ah .ac{font-size:22px;color:#007aff;background:none;border:none;cursor:pointer;padding:4px 8px;flex-shrink:0}
.ab{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;padding:0}
.ab::-webkit-scrollbar{display:none}
.wx-tabs{display:flex;background:#f7f7f7;border-top:.5px solid #e5e5e5;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.wx-tab{flex:1;padding:8px 0 6px;text-align:center;font-size:11px;color:#7f7f7f;cursor:pointer;position:relative}
.wx-tab.on{color:#07c160}
.wx-tab .ic{font-size:22px;display:block;margin-bottom:2px;position:relative}
.wx-tab .bdg{position:absolute;top:-4px;right:calc(50% - 22px);min-width:16px;height:16px;line-height:16px;background:#ff3b30;color:#fff;font-size:10px;border-radius:8px;padding:0 4px;text-align:center;font-weight:600}
.chat-item{display:flex;gap:12px;padding:12px;background:#fff;cursor:pointer;align-items:center;border-bottom:.5px solid #f0f0f0;user-select:none}
.chat-item .a{width:48px;height:48px;border-radius:6px;background:#fde8f0;display:grid;place-items:center;font-size:24px;flex-shrink:0;overflow:hidden;position:relative}
.chat-item .a img{width:100%;height:100%;object-fit:cover;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}
.chat-item .a .dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#34c759}
.chat-item .in{flex:1;min-width:0}
.chat-item .in .h{font-size:15px;font-weight:500;display:flex;justify-content:space-between;align-items:center;color:#1c1c1e}
.chat-item .in .h .t{font-size:11px;color:#b2b2b2}
.chat-item .in .m{font-size:13px;color:#7f7f7f;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .bdg2{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
.star-mark{color:#f5c518;font-size:12px;margin-right:4px}
.list-item{display:flex;gap:12px;padding:14px 16px;background:#fff;border-bottom:.5px solid #f0f0f0;cursor:pointer;align-items:center}
.list-item .ic{width:40px;height:40px;border-radius:8px;background:#fde8f0;display:grid;place-items:center;font-size:20px;flex-shrink:0;overflow:hidden}
.list-item .ic img{width:100%;height:100%;object-fit:cover}
.list-item .nm{flex:1;font-size:15px;color:#1c1c1e}
.list-item .rt{color:#ccc;font-size:14px}
.me-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.wx-chat{display:flex;flex-direction:column;height:100%;min-height:0;position:relative;background:#ededed}
.wx-chat-body{flex:1;overflow-y:auto;padding:12px 12px 4px;min-height:0;position:relative;z-index:1}
.wx-msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.wx-msg.me{flex-direction:row-reverse}
.wx-msg .av{width:40px;height:40px;border-radius:6px;background:#fde8f0;display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden}
.wx-msg .av img{width:100%;height:100%;object-fit:cover}
.wx-msg .content{max-width:72%;position:relative}
.wx-msg .b{padding:10px 12px;border-radius:6px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap;color:#000}
.wx-msg .b img{max-width:200px;border-radius:4px;display:block}
.wx-msg .name{font-size:11px;color:#7f7f7f;margin-bottom:3px;padding:0 4px}
.ai-group{margin-bottom:10px}
.ai-group .wx-msg{margin-bottom:6px}
.time-sep{text-align:center;font-size:11px;color:#b2b2b2;margin:10px 0 8px;user-select:none}
.narration-block{font-size:13px;color:#7f7f7f;font-style:italic;padding:8px 14px;margin:6px 12px 6px 50px;border-left:2px solid #d0d0d0;background:rgba(0,0,0,.02);border-radius:6px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.narration-block.me{margin:6px 50px 6px 12px;border-left:none;border-right:2px solid #d0d0d0;text-align:right}
.wx-chat-input{display:flex;gap:8px;padding:8px 12px;align-items:flex-end;flex-shrink:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));position:relative;z-index:1;border-top:.5px solid rgba(0,0,0,.06)}
.wx-chat-input .btn-circle{width:34px;height:34px;border-radius:50%;border:none;font-size:20px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.wx-chat-input .btn-circle.plus{font-size:26px;font-weight:300;margin-bottom:4px}
.wx-chat-input textarea{flex:1;border:none;outline:none;padding:9px 12px;border-radius:8px;font-size:15px;font-family:inherit;min-width:0;resize:none;line-height:1.35;max-height:96px;overflow-y:auto}
.wx-chat-input .send{border:none;border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:500;flex-shrink:0;margin-bottom:2px}
.wx-chat.online{background:#ededed}
.wx-chat.online .wx-chat-input{background:#f7f7f7}
.wx-chat.online .btn-circle{background:#fff;color:#333}
.wx-chat.online textarea{background:#fff;color:#000}
.wx-chat.online .send{background:#07c160;color:#fff}
.wx-chat.online .b{background:#fff;color:#000}
.wx-chat.online .me .b{background:#95ec69}
.wx-chat.online .narration-block{color:#8a8a8a;border-left-color:#d8d8d8;background:rgba(0,0,0,.03)}
.wx-chat.online .narration-block.me{color:#5a7a55;border-right-color:#b8d8b0;background:rgba(150,200,140,.12)}
.wx-chat.offline{background:var(--off-bg,#1a1820);color:#f0e8ff}
.wx-chat.offline .wx-chat-input{background:rgba(0,0,0,.25)}
.wx-chat.offline .btn-circle{background:rgba(255,255,255,.12);color:#f0e8ff}
.wx-chat.offline textarea{background:rgba(255,255,255,.1);color:#f0e8ff}
.wx-chat.offline textarea::placeholder{color:rgba(255,255,255,.5)}
.wx-chat.offline .send{background:var(--off-accent,#a78bfa);color:#fff}
.wx-chat.offline .ai .b{background:rgba(255,255,255,.12);color:#f0e8ff}
.wx-chat.offline .me .b{background:var(--off-accent,#a78bfa);color:#fff}
.wx-chat.offline .name{color:rgba(255,255,255,.7)}
.wx-chat.offline .time-sep{color:rgba(255,255,255,.45)}
.wx-chat.offline .narration-block{color:rgba(255,255,255,.7);border-left-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
.wx-chat.offline .narration-block.me{color:rgba(255,255,255,.7);border-right-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
.wx-chat.dream{background:radial-gradient(circle at 50% 30%,#2a1f45,#0d0817 70%);color:#e8dcff}
.wx-chat.dream .wx-chat-input{background:rgba(20,12,35,.7)}
.wx-chat.dream .btn-circle{background:rgba(180,150,255,.15);color:#e0d8f0}
.wx-chat.dream textarea{background:rgba(40,30,65,.5);color:#e8dcff;border:1px solid rgba(180,150,255,.25)}
.wx-chat.dream textarea::placeholder{color:#8875aa}
.wx-chat.dream .send{background:linear-gradient(135deg,#a78bfa,#7c5fbf);color:#fff}
.wx-chat.dream .ai .b{background:rgba(60,45,90,.7);color:#e8dcff}
.wx-chat.dream .me .b{background:rgba(140,100,200,.5);color:#fff}
.wx-chat.dream .name{color:#b0a0d0}
.wx-chat.dream .time-sep{color:#8875aa}
.wx-chat.dream .narration-block{color:#b0a0d0;border-left-color:rgba(180,150,255,.35);background:rgba(180,150,255,.08)}
.wx-chat.dream .narration-block.me{color:#c8b0e8;border-right-color:rgba(180,150,255,.35);background:rgba(180,150,255,.1)}
.wx-chat.roleplay{background:linear-gradient(180deg,#1a1520,#241a2e);color:#e8dcff}
.wx-chat.roleplay .wx-chat-input{background:#241a2e}
.wx-chat.roleplay .btn-circle{background:rgba(255,255,255,.12);color:#e8dcff}
.wx-chat.roleplay textarea{background:#3a2f4a;color:#e8dcff}
.wx-chat.roleplay .send{background:#7c5fbf;color:#fff}
.wx-chat.roleplay .ai .b{background:#3a2f4a;color:#e8dcff}
.wx-chat.roleplay .me .b{background:#7c5fbf;color:#fff}
.wx-chat.roleplay .name{color:#b0a0d0}
.wx-chat.roleplay .time-sep{color:#b0a0d0}
.wx-chat.roleplay .narration-block{color:#b0a0d0;border-left-color:rgba(180,150,255,.35);background:rgba(180,150,255,.08)}
.wx-chat.roleplay .narration-block.me{color:#c8b0e8;border-right-color:rgba(180,150,255,.35);background:rgba(180,150,255,.1)}
.offline-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:3px 12px;border-radius:10px;z-index:5;pointer-events:none;backdrop-filter:blur(10px)}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:16px;font-weight:700;text-align:center;color:#1c1c1e}
.btn{border:none;background:#007aff;color:#fff;font-size:15px;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}
.btn.g{background:rgba(0,122,255,.12);color:#007aff}
.btn.d{background:#ff3b30}
.btn.f{width:100%;padding:14px;font-size:16px;border-radius:12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;position:relative}
.fld label{font-size:12px;color:#8e8e93;padding-left:4px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.fld label .ex{color:#007aff;font-size:14px;cursor:pointer;padding:0 4px;font-weight:400}
.fld input,.fld textarea,.fld select{border:none;background:#fff;border-radius:10px;padding:12px 14px;font-size:15px;outline:none;color:#1c1c1e;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.04);width:100%;max-width:100%;box-sizing:border-box}
.fld input:focus,.fld textarea:focus,.fld select:focus{box-shadow:0 0 0 2px #007aff}
.fld textarea{resize:vertical;min-height:80px;line-height:1.5}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.card .t{font-size:15px;font-weight:600;margin-bottom:4px;color:#1c1c1e}
.card .d{font-size:13px;color:#8e8e93;line-height:1.5;word-break:break-all}
.sw{width:51px;height:31px;border-radius:16px;background:#e5e5ea;position:relative;transition:background .25s;cursor:pointer;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}
.rc{padding:7px 14px;border-radius:16px;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;display:flex;align-items:center;gap:4px;font-weight:500;flex-shrink:0;color:#1c1c1e}
.rc.on{background:#007aff;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:11px 22px;border-radius:22px;font-size:14px;backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:all .3s;z-index:9999;font-weight:500;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mask-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:599}
.plus-panel{position:fixed;left:0;right:0;bottom:0;background:#f7f7f7;border-top:.5px solid #e5e5e5;border-radius:20px 20px 0 0;padding:20px;z-index:600;display:grid;gap:16px;grid-template-columns:repeat(4,1fr);animation:slideUp .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom,0))}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.plus-panel .pi{text-align:center;cursor:pointer}
.plus-panel .pi .ic{width:56px;height:56px;background:#fff;border-radius:14px;display:grid;place-items:center;font-size:26px;margin:0 auto 6px}
.plus-panel .pi .nm{font-size:12px;color:#666}
.long-menu{position:fixed;z-index:800;background:rgba(40,40,40,.95);border-radius:14px;padding:6px 0;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-height:60vh;overflow-y:auto}
.long-menu .mi{display:flex;align-items:center;gap:10px;padding:11px 16px;color:#fff;font-size:15px;cursor:pointer}
.long-menu .mi .ic{font-size:16px;width:20px;text-align:center}
.expand-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.expand-modal .inner{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:92vw;max-height:92vh;display:flex;flex-direction:column}
.expand-modal textarea{flex:1;width:100%;min-height:60vh;border:none;background:#f7f7f7;border-radius:10px;padding:14px;font-size:15px;outline:none;font-family:inherit;line-height:1.6;resize:none}
.emotion-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.emotion-item .eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.emotion-item .en{font-size:15px;font-weight:600;color:#1c1c1e}
.emotion-item .ev{font-size:15px;font-weight:700;color:#ff6b9d}
.emotion-item input[type=range]{width:100%;accent-color:#ff6b9d}
details{background:#fff;border-radius:10px;margin-bottom:8px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
details summary{font-size:14px;font-weight:600;cursor:pointer;color:#1c1c1e;outline:none}
details[open] summary{margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.row3 .fld,.row2 .fld{margin-bottom:0}
.row3 .fld label,.row2 .fld label{font-size:11px;padding-left:2px}
.row3 .fld input,.row2 .fld input{padding:10px 10px;font-size:14px}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.3)}}
::-webkit-scrollbar{width:0;display:none}
/* 转账气泡 */
.transfer-bubble{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;background:#fff;min-width:220px;cursor:pointer;border:1px solid #e5e5e5}
.transfer-bubble.me{background:#f5b451;border-color:#e0a040}
.transfer-bubble .tb-row{display:flex;align-items:center;gap:10px}
.transfer-bubble .tb-icon{width:38px;height:38px;border-radius:50%;border:2px solid #f5b451;display:grid;place-items:center;font-size:18px;color:#f5b451;flex-shrink:0;font-weight:700}
.transfer-bubble.me .tb-icon{border-color:#fff;color:#fff}
.transfer-bubble .tb-info{flex:1;min-width:0}
.transfer-bubble .tb-amt{font-size:18px;font-weight:700;color:#f5b451}
.transfer-bubble.me .tb-amt{color:#fff}
.transfer-bubble .tb-stat{font-size:12px;color:#f5b451;margin-top:2px}
.transfer-bubble.me .tb-stat{color:rgba(255,255,255,.9)}
.transfer-bubble .tb-label{font-size:11px;color:#f5b451;opacity:.85}
.transfer-bubble.me .tb-label{color:rgba(255,255,255,.85)}
/* 红包气泡 */
.redpack-bubble{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;background:#d94a1f;min-width:220px;cursor:pointer;position:relative;overflow:hidden}
.redpack-bubble.me{background:#d94a1f}
.redpack-bubble .tb-row{display:flex;align-items:center;gap:10px}
.redpack-bubble .tb-icon{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;font-size:22px}
.redpack-bubble .tb-info{flex:1;min-width:0}
.redpack-bubble .tb-amt{font-size:15px;font-weight:700;color:#fff}
.redpack-bubble .tb-stat{font-size:11px;color:rgba(255,255,255,.9);margin-top:2px}
.redpack-bubble .tb-label{font-size:11px;color:rgba(255,255,255,.85)}
/* 聊天系统消息 */
.chat-sys-msg{text-align:center;font-size:12px;color:#8e8e93;margin:10px 12px;padding:2px 0;line-height:1.6}
/* 转账详情页 */
.transfer-open{position:fixed;inset:0;background:#191919;z-index:1000;display:flex;flex-direction:column;align-items:center;padding:40px 20px 30px;color:#fff;overflow-y:auto}
.transfer-open .close-btn{position:absolute;top:calc(20px + env(safe-area-inset-top,0));left:20px;font-size:26px;color:#ddd;cursor:pointer;z-index:2}
.transfer-open .icon-top{width:56px;height:56px;border-radius:50%;border:3px solid #4a8df0;display:grid;place-items:center;font-size:26px;color:#4a8df0;margin-bottom:14px;font-weight:700}
.transfer-open .icon-top.done{border-color:#07c160;color:#07c160}
.transfer-open .done-icon{width:64px;height:64px;border-radius:50%;background:#07c160;display:grid;place-items:center;font-size:32px;color:#fff;margin-bottom:14px}
.transfer-open .title{font-size:15px;color:#c8c8c8;margin-bottom:6px;text-align:center}
.transfer-open .amt{font-size:44px;font-weight:400;color:#fff;margin:8px 0 6px;letter-spacing:1px}
.transfer-open .subtitle{font-size:13px;color:#999;margin-bottom:20px}
.transfer-open .section-label{width:100%;max-width:340px;font-size:13px;color:#999;margin-bottom:10px;text-align:left}
.transfer-open .pick-box{width:100%;max-width:340px;background:#2a2a2a;border-radius:10px;margin-bottom:22px;overflow:hidden}
.transfer-open .pick-item{display:flex;align-items:center;padding:16px 18px;cursor:pointer;border-bottom:.5px solid #333}
.transfer-open .pick-item:last-child{border-bottom:none}
.transfer-open .pick-item .pk-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;margin-right:12px;flex-shrink:0}
.transfer-open .pick-item .pk-icon.yuan{background:#f5a623;color:#fff}
.transfer-open .pick-item .pk-icon.diamond{background:#3b2e1a;color:#f5c518}
.transfer-open .pick-item .pk-info{flex:1;min-width:0}
.transfer-open .pick-item .pk-name{font-size:15px;color:#fff;display:flex;align-items:center;gap:6px}
.transfer-open .pick-item .pk-name .rate{font-size:11px;background:#3a2e18;color:#e8b96a;padding:1px 5px;border-radius:3px}
.transfer-open .pick-item .pk-desc{font-size:12px;color:#888;margin-top:3px}
.transfer-open .pick-item .pk-check{color:#07c160;font-size:20px;opacity:0;flex-shrink:0}
.transfer-open .pick-item.on .pk-check{opacity:1}
.transfer-open .time-box{width:100%;max-width:340px}
.transfer-open .time-box .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:#888}
.transfer-open .time-box .row .val{color:#ddd}
.transfer-open .btn-receive{width:100%;max-width:340px;padding:15px;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:600;cursor:pointer;margin-top:24px}
.transfer-open .footer{font-size:12px;color:#666;margin-top:14px;text-align:center}
.transfer-open .footer .refund{color:#4a8df0;margin-left:6px;cursor:pointer}

function stripAction(text){if(!text)return text;return String(text).replace(/[（(][^（）()]*[）)]/g,'').replace(/\s+/g,' ').trim()}
function splitNarration(text){
  const parts=[];let last=0;const re=/[（(][^（）()]*[）)]/g;let m;
  while((m=re.exec(text))!==null){
    if(m.index>last){const t=text.slice(last,m.index).trim();if(t)parts.push({type:'dialog',text:t})}
    parts.push({type:'narration',text:m[0]});last=m.index+m[0].length;
  }
  if(last<text.length){const t=text.slice(last).trim();if(t)parts.push({type:'dialog',text:t})}
  if(parts.length===0)parts.push({type:'dialog',text});
  return parts;
}

function compressImage(file,maxSize,callback){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize}else{w=Math.round(w*maxSize/h);h=maxSize}}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.92));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function readFileAsDataURL(file,callback){const r=new FileReader();r.onload=e=>callback(e.target.result);r.readAsDataURL(file)}
function fmtMsgTime(t){
  const d=new Date(t),now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const msgDay=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((today-msgDay)/86400000);
  const hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(diff===0)return hm;
  if(diff===1)return '昨天 '+hm;
  if(diff<7)return '周'+['日','一','二','三','四','五','六'][d.getDay()]+' '+hm;
  if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function fmtShort(t){
  const d=new Date(t),now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString().slice(0,5);
  const y=new Date(now);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return '昨天';
  return (d.getMonth()+1)+'/'+d.getDate();
}

function smartParseJSON(text){
  if(!text)return null;
  let t=String(text).trim();
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/\{[\s\S]*\}/);
  if(m){
    try{return JSON.parse(m[0])}catch(e){}
    let fix=m[0].replace(/,\s*([}\]])/g,'$1').replace(/'/g,'"');
    try{return JSON.parse(fix)}catch(e){}
  }
  return null;
}

function parseTransferText(text){
  if(!text)return null;
  const tryParse=(prefix,type)=>{
    if(!text.startsWith(prefix))return null;
    const rest=text.slice(prefix.length);
    let depth=0,start=-1,end=-1,inStr=false,esc=false;
    for(let i=0;i<rest.length;i++){
      const c=rest[i];
      if(esc){esc=false;continue}
      if(c==='\\'){esc=true;continue}
      if(c==='"'){inStr=!inStr;continue}
      if(inStr)continue;
      if(c==='{'){if(depth===0)start=i;depth++}
      else if(c==='}'){depth--;if(depth===0){end=i;break}}
    }
    if(start<0||end<0)return null;
    try{return {type,data:JSON.parse(rest.slice(start,end+1)),tail:rest.slice(end+1).trim()}}
    catch(e){return null}
  };
  return tryParse('__transfer__','transfer')||tryParse('__redpack__','redpack');
}

function refreshChat(){
  const ctx=getCurrentChatCtx();if(!ctx)return;
  const cb=$('wxcb');if(!cb)return;
  const r=getRole(ctx.roleId);
  let hist=getChatByMode(ctx.roleId,ctx.mode);

  // 👇 【修复1】过滤掉导致白屏的脏数据
  hist = hist.filter(m => m && m.role && (typeof m.text === 'string' || typeof m.text === 'undefined'));

  if(!hist.length){
    const greet=ctx.mode==='offline'?`（${r.name}看向你）你来了。`:'你好呀～我是'+r.name;
    const gm={role:'ai',text:greet,time:Date.now(),read:true,id:uid('m')};
    hist.push(gm);saveChatByMode(ctx.roleId,ctx.mode,hist);
  }
  let pendingThanks=[];let changed=false;
  hist.forEach(msg=>{
    if(msg.role!=='user')return;
    const t=parseTransferText(msg.text);if(!t)return;
    const d=t.data;
    if(t.type==='transfer'&&!d.received){
      d.received=true;d.receivedTime=Date.now();
      msg.text='__transfer__'+JSON.stringify(d);
      hist.push({role:'sys',text:'✅ '+r.name+'已收款',time:Date.now(),read:true,id:uid('m')});
      changed=true;
      // 👇 【修复2】去掉60秒限制，只要你发过，进来看见就回
      pendingThanks.push(`用户给你转了 ¥${d.amount}`); 
    }else if(t.type==='redpack'&&!d.opened&&!d.received){
      d.opened=true;d.received=true;d.receivedTime=Date.now();
      d.receiverName=r.remark||r.name;d.receiverAv=r.avatarImg||r.avatar;
      msg.text='__redpack__'+JSON.stringify(d);

function parseAIResponse(text){
  const parts=[];
  let remaining=text;
  const re=/(\[(?:转账|红包|表情):[^\]]+\])/g;
  let last=0,m;
  while((m=re.exec(text))!==null){
    if(m.index>last){const t=text.slice(last,m.index).trim();if(t)parts.push({type:'text',text:t})}
    parts.push({type:'special',text:m[0]});last=m.index+m[0].length;
  }
  if(last<text.length){const t=text.slice(last).trim();if(t)parts.push({type:'text',text:t})}
  if(parts.length===0&&text.trim())parts.push({type:'text',text});
  return parts;
}
function autoReply(roleId,mode){
  const r=getRole(roleId);if(!r)return;
  const hist=getChatByMode(roleId,mode);
  const tmp={role:'ai',text:'...',time:Date.now(),read:false,id:'tmp_'+Date.now()};
  const handle=addMsgToView('ai','...',r,tmp,mode);
  const el=handle.group?handle.group:handle;
  let historyForAI;
  if(mode==='online'&&API.strictMode!==false){
    historyForAI=hist.slice(-16).map(x=>({role:x.role==='ai'?'assistant':'user',content:x.role==='ai'?stripAction(x.text):x.text}));
  }else{
    historyForAI=hist.slice(-16).map(x=>({role:x.role==='ai'?'assistant':'user',content:x.text}));
  }
  const temp=mode==='offline'?API.temp:API.tempOnline;
  callAI(buildPrompt(r,null,mode),historyForAI,temp,
    (d,full)=>{renderAiGroup(el,full,r,mode==='offline',mode);const cb=$('wxcb');if(cb)cb.scrollTop=cb.scrollHeight}
  ).then(res=>{
    let final=res;
    if(mode==='online'&&API.strictMode!==false)final=stripAction(res);
    final=String(final||'').trim()||'（沉默）';
    const parts=parseAIResponse(final);
    let delay=0;
    const allMsgs=[];
    parts.forEach(p=>{
      if(p.type==='text'){
        allMsgs.push({role:'ai',text:p.text,time:Date.now()+delay,read:false,id:uid('m')});
        delay+=200;
      }else{
        const t=p.text;
        if(t.startsWith('[转账:')){
          const mm=t.match(/\[转账:([\d.]+):?(.*?)\]/);
          if(mm){
            const amt=parseFloat(mm[1])||0;
            allMsgs.push({role:'ai',text:'__transfer__'+JSON.stringify({amount:amt,note:mm[2]||'',received:false}),time:Date.now()+delay,read:false,id:uid('m')});
            delay+=200;
          }
        }else if(t.startsWith('[红包:')){
          const mm=t.match(/\[红包:([\d.]+):?(.*?)\]/);
          if(mm){
            let amt=parseFloat(mm[1])||0;
            if(amt>200)amt=200;
            allMsgs.push({role:'ai',text:'__redpack__'+JSON.stringify({amount:amt,wish:mm[2]||'',received:false,opened:false}),time:Date.now()+delay,read:false,id:uid('m')});
            delay+=200;
          }
        }else if(t.startsWith('[表情:')){
          const mm=t.match(/\[表情:(.+?)\]/);
          if(mm){
            const emo=getEmojis().find(e=>e.label===mm[1]);
            if(emo)allMsgs.push({role:'ai',text:'data:image:'+emo.img.split(',')[0].split(':')[1]+';base64,'+emo.img.split(',')[1],time:Date.now()+delay,read:false,id:uid('m')});
            else allMsgs.push({role:'ai',text:'[表情:'+mm[1]+']',time:Date.now()+delay,read:false,id:uid('m')});
            delay+=200;
          }
        }
      }
    });
    el.innerHTML='';
    if(allMsgs.length===0)allMsgs.push({role:'ai',text:final,time:Date.now(),read:false,id:uid('m')});
    allMsgs.forEach(m=>{
      hist.push(m);saveChatByMode(roleId,mode,hist);
      addMsgToView('ai',m.text,r,m,mode);
    });
    const aiCount=hist.filter(x=>x.role==='ai').length;
    const lastSum=parseInt(ls('wx_lastsum_'+roleId+'_'+mode)||'0');
    if(aiCount>=10&&aiCount-lastSum>=10){ls('wx_lastsum_'+roleId+'_'+mode,String(aiCount));summarizeToMemory(r,hist)}
  }).catch(e=>{el.innerHTML=`<div style="padding:8px;color:#ff3b30">失败：${esc(e.message)}</div>`});
}
function summarizeToMemory(role,hist){
  if(!API.url||!API.key)return;
  const recent=hist.slice(-20).map(m=>(m.role==='ai'?role.name:'我')+': '+stripAction(m.text)).join('\n');
  const sys='请从这段对话里，提取1-3条值得记住的事件（第三人称，每条20字内）。只输出事件，每条一行。';
  callAI(sys,[{role:'user',content:recent}]).then(text=>{
    const lines=text.split('\n').map(x=>x.trim()).filter(Boolean);
    lines.forEach(line=>{
      role.memories=role.memories||[];
      if(!role.memories.some(m=>m.text===line))role.memories.unshift({text:line,time:Date.now()});
    });
    if(role.memories.length>30)role.memories.length=30;
    saveRoles();
  }).catch(()=>{});
}

function fetchModels(){
  const u=$('gUrl').value.trim();const k=$('gKey').value.trim();
  if(!u||!k){toast('先填地址和Key');return}
  API.url=u;API.key=k;saveAPI();
  const mu=getModelsUrl(u);
  fetch(mu,{headers:{'Authorization':'Bearer '+k}})
    .then(r=>r.ok?r.json():r.text().then(t=>{throw new Error(r.status+': '+t.slice(0,80))}))
    .then(d=>{
      if(d.data&&d.data.length){
        API.models=d.data.map(m=>m.id).sort();
        if(!API.models.includes(API.model))API.model=API.models[0];
        saveAPI();renderSettings($('appB'));toast('已获取 '+API.models.length+' 个');
      }else toast('格式不对');
    }).catch(e=>toast('失败：'+e.message));
}

function downloadFile(name,content,type){

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},100);

function renderMomentList(moments){
  if(!moments.length)return '<div style="text-align:center;padding:60px 20px;color:#999">还没有朋友圈<br><br>点右上角 📷 发布</div>';
  const me=lj('wx_me')||{nickname:'我',avatar:'🙂',avatarImg:''};
  return moments.map(m=>{
    let author;
    if(m.authorId==='me'){author={name:me.nickname,avatar:me.avatar,avatarImg:me.avatarImg}}
    else{const r=getRole(m.authorId);author=r?{name:r.remark||r.name,avatar:r.avatar,avatarImg:r.avatarImg}:{name:'未知',avatar:'❓',avatarImg:''}}
    const avImg=author.avatarImg?`<img src="${author.avatarImg}" style="width:100%;height:100%;object-fit:cover"/>`:author.avatar;
    const likes=m.likes||[];
    const liked=likes.includes('me');
    const likeNames=likes.map(id=>{
      if(id==='me')return me.nickname;
      const r=getRole(id);return r?(r.remark||r.name):'';
    }).filter(Boolean).join('，');
    return `<div class="post" data-mid="${m.id}">
      <div class="header">
        <div class="av">${avImg}</div>
        <div class="info"><div class="name">${esc(author.name)}</div><div class="time">${fmtMomentTime(m.time)}</div></div>
        <div class="menu-btn" onclick="momentMenu('${m.id}')">⋯</div>
      </div>
      ${m.text?`<div class="text">${esc(m.text)}</div>`:''}
      ${m.images&&m.images.length?`<div class="imgs ${m.images.length===1?'single':''}">${m.images.map(img=>`<img src="${img}" onclick="previewImg('${img}')"/>`).join('')}</div>`:''}
      ${m.location?`<div style="font-size:12px;color:#576b95;margin-bottom:8px">📍 ${esc(m.location)}</div>`:''}
      <div class="footer">
        <div class="like-btn ${liked?'on':''}" onclick="toggleMomentLike('${m.id}')">${liked?'❤️':'🤍'} 赞</div>
        <div class="comment-btn" onclick="commentMoment('${m.id}')">💬 评论</div>
      </div>
      ${likeNames?`<div class="likes">❤️ ${esc(likeNames)}</div>`:''}
      ${m.comments&&m.comments.length?`<div class="comments">${m.comments.map(c=>{
        const cAuthor=c.authorId==='me'?me.nickname:(()=>{const r=getRole(c.authorId);return r?(r.remark||r.name):'未知'})();
        return `<div class="c-item"><span class="c-name">${esc(cAuthor)}</span>${c.replyTo?`<span class="c-reply"> 回复 ${esc(c.replyTo)}</span>`:''}<span class="c-text">：${esc(c.text)}</span><span class="c-time">${fmtMomentTime(c.time)}</span></div>`;
      }).join('')}</div>`:''}
    </div>`;
  }).join('');
}
function fmtMomentTime(t){
  const d=new Date(t),now=new Date();
  const diff=Math.floor((now-d)/1000);
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+'分钟前';
  if(diff<86400)return Math.floor(diff/3600)+'小时前';
  if(diff<86400*7)return Math.floor(diff/86400)+'天前';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}

  const m=list.find(x=>x.id===mid);if(!m)return;
  if(!m.likes)m.likes=[];
  const idx=m.likes.indexOf('me');
  if(idx>=0)m.likes.splice(idx,1);else m.likes.push('me');
  saveMoments(list);renderMomentsPage();
}

function aiReplyComment(mid,c){

  const sys=buildPrompt(r,`用户在你的朋友圈动态下评论了："${c.text}"。请用一句话回复评论。不要提AI。`,'online');

function scheduleAIComment(moment){
  const roles_=roles.filter(r=>r.momentEnabled);
  if(!roles_.length)return;
  roles_.forEach(r=>{
    const delay=Math.floor(Math.random()*120000)+5000;
    setTimeout(()=>{
      aiCommentUserMoment(moment.id,r);

  });
}
function aiCommentUserMoment(mid,r){
  const list=getMoments();const m=list.find(x=>x.id===mid);if(!m)return;
  if(m.comments&&m.comments.some(c=>c.authorId===r.id))return;
  const recent=getChatOnline(r.id).slice(-6).map(x=>(x.role==='ai'?r.name:'我')+': '+x.text).join('\n');
  const sys=buildPrompt(r,`用户刚发了一条朋友圈，内容是："${m.text}"。请你根据人设评论一句（30字内）。不要提AI。可以结合你们最近的聊天。\n最近聊天：\n${recent||'（无）'}`,'online');
  callAI(sys,[{role:'user',content:'（评论朋友圈）'}],API.tempOnline).then(res=>{
    const clean=stripAction(res).trim();if(!clean)return;
    const l2=getMoments();const m2=l2.find(x=>x.id===mid);if(!m2)return;
    m2.comments=m2.comments||[];

function checkMomentProactive(){
  if(!API.url||!API.key)return;
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  roles.forEach(r=>{
    if(!r.momentEnabled)return;
    let interval=0;
    const mi=r.momentInterval||'random';
    if(mi==='1h')interval=3600000;
    else if(mi==='3h')interval=3*3600000;
    else if(mi==='12h')interval=12*3600000;
    else if(mi==='1d')interval=24*3600000;
    else if(mi==='2d')interval=48*3600000;
    else if(mi==='custom'){
      const times=(r.momentCustomTimes||'').split(',').map(x=>x.trim()).filter(Boolean);
      const hm=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
      if(!times.includes(hm))return;
      interval=0;
    }else{
      interval=(Math.random()*5+1)*3600000;
    }
    const last=parseInt(ls('wx_moment_last_'+r.id)||'0');
    if(Date.now()-last<interval)return;
    ls('wx_moment_last_'+r.id,String(Date.now()));
    genMoment(r);
  });
}
function genMoment(r){
  const recent=getChatOnline(r.id).slice(-10).map(x=>(x.role==='ai'?r.name:'我')+': '+x.text).join('\n');
  const emoTxt=r.emotions&&r.emotions.length?r.emotions.map(e=>`${e.name}${e.value}`).join('，'):'';
  const sys=buildPrompt(r,`现在你要发一条朋友圈。
要求：
- 30~80字，像真人随手发的
- 内容围绕你此刻的心情/生活/想对用户说的话
- 不要用括号旁白，不要写动作
- 不要提到"朋友圈"三个字
- 可以带1~2个emoji
- 只输出朋友圈正文，不要任何解释
你最近和用户的聊天：
${recent||'（无）'}
你的情绪值：${emoTxt}
`,'online');
  callAI(sys,[{role:'user',content:'（发朋友圈）'}],API.tempOnline).then(res=>{
    const clean=stripAction(res).trim();if(!clean)return;
    const list=getMoments();
    list.push({id:uid('mo'),authorId:r.id,text:clean,images:[],time:Date.now(),likes:[],comments:[]});
    saveMoments(list);
    const top=wxNav[wxNav.length-1];
    if(top&&top.view==='moments')renderMomentsPage();
    r.memories=r.memories||[];r.memories.unshift({text:'我发了朋友圈：'+clean.slice(0,30),time:Date.now()});
    if(r.memories.length>30)r.memories.length=30;
    saveRoles();
  }).catch(()=>{});
}

function saveRoleEditor(id,isEdit){
  const oldR=isEdit?getRole(id):null;
  const nr=roleFromPreset({id});
  if(oldR){Object.assign(nr,{avatarImg:oldR.avatarImg,chatBg:oldR.chatBg,proactive:oldR.proactive,memories:oldR.memories,dreamMemories:oldR.dreamMemories,emotions:oldR.emotions,starred:oldR.starred,dreamSetup:oldR.dreamSetup,offline:oldR.offline,rps:oldR.rps,momentCover:oldR.momentCover,remark:oldR.remark,tags:oldR.tags,region:oldR.region,momentPermission:oldR.momentPermission,momentEnabled:oldR.momentEnabled,momentInterval:oldR.momentInterval,momentCustomTimes:oldR.momentCustomTimes,allowEmoji:oldR.allowEmoji})}
  FIELD_GROUPS.forEach(g=>g.ks.forEach(k=>{const el=$('_m_'+k.k);if(el)nr[k.k]=el.value.trim()}));
  USER_FIELDS.forEach(k=>{const el=$('_u_'+k.k);if(el)nr[k.k]=el.value.trim()});
  nr.name=nr.name||'新角色';
  nr.avatar=nr.avatar||'🖤';
  nr.wxId=$('_rwxid')?$('_rwxid').value.trim():'';
  nr.persona=$('_mp').value.trim();
  nr.aiTags=$('_aiTags').value.trim();
  nr.aiCommands=$('_aiCommands').value.trim();
  nr.aiForbidden=$('_aiForbidden').value.trim();
  let pending=1;
  const done=()=>{
    if(--pending<=0){
      if(isEdit){const i=roles.findIndex(x=>x.id===id);roles[i]=nr}
      else{roles.push(nr)}
      saveRoles();closeModal();goMain();toast('已保存');
    }
  };
  const f1=$('_aimg')?$('_aimg').files[0]:null;
  if(f1){compressImage(f1,1024,(dataUrl)=>{nr.avatarImg=dataUrl;done()})}else done();
}
function aiPolishRole(){
  const draft=$('_aiDraft').value.trim();
  if(!draft){toast('先写一段设定');return}
  if(!API.url||!API.key){toast('先配置 API');return}
  const allKeys=[];
  FIELD_GROUPS.forEach(g=>g.ks.forEach(k=>allKeys.push(k.k)));
  USER_FIELDS.forEach(k=>allKeys.push(k.k));
  const keyList=allKeys.map(k=>k+'('+LABELS[k]+')').join('、');
  const sys=`你是角色设定整理者。用户给你一段粗略设定，请严格按 JSON 输出，key 用：${keyList}，再加一个 _leftover 字段放未分类信息。只输出 JSON。`;
  toast('AI 润色中...');
  callAI(sys,[{role:'user',content:draft}]).then(text=>{
    let data=smartParseJSON(text);
    if(!data){const mp=$('_mp');if(mp)mp.value=draft;toast('已直接填入');return}
    let count=0;
    Object.keys(data).forEach(k=>{if(k==='_leftover')return;const el=$('_m_'+k)||$('_u_'+k);if(el&&data[k]){el.value=String(data[k]).trim();count++}});
    toast(count?'已填入 '+count+' 个字段':'没解析出字段');
  }).catch(e=>toast('失败：'+e.message));
}
function deleteRole(id){
  if(roles.length<=1){toast('至少保留一个');return}
  if(!confirm('删除该角色？'))return;
  const r=getRole(id);
  (r.rps||[]).forEach(rp=>localStorage.removeItem('wx_rp_chat_'+rp.id));
  roles=roles.filter(x=>x.id!==id);saveRoles();
  localStorage.removeItem('wx_chat_'+id);localStorage.removeItem('wx_chat_'+id+'_offline');
  localStorage.removeItem('wx_dream_'+id);localStorage.removeItem('wx_dream_history_'+id);
  goMain();
}

function refreshDream(){

  const top=wxNav[wxNav.length-1];if(!top||top.view!=='dream')return;
  const id=top.id;const hist=getDream(id);const r=getRole(id);
  if(!hist.length){addDreamMsg('ai','（梦还没开始...）',r,null,true);return}
  let lastT=0;
  hist.forEach(m=>{
    if(!lastT||(m.time-lastT)>5*60*1000){const d=document.createElement('div');d.className='time-sep';d.textContent=fmtMsgTime(m.time);db.appendChild(d)}
    lastT=m.time||0;
    addDreamMsg(m.role,m.text,m.role==='ai'?r:null,m,m.type==='opening');
  });
  db.scrollTop=db.scrollHeight;
}
function addDreamMsg(role,text,roleObj,msgObj,isOpening){
  const db=$('dreamBody');if(!db)return null;
  if(isOpening){
    const wrap=document.createElement('div');
    wrap.style.cssText='padding:12px 20px;margin:8px 20px;background:rgba(90,65,130,.4);border-radius:12px;font-style:italic;color:#d0b8ff;text-align:center;font-size:13px;line-height:1.8;white-space:pre-wrap';
    wrap.textContent=text;db.appendChild(wrap);return wrap;
  }
  if(role==='ai'){
    const group=document.createElement('div');group.className='ai-group';
    renderDreamAiGroup(group,text,roleObj);
    db.appendChild(group);db.scrollTop=db.scrollHeight;
    return {group,setText:(t)=>{renderDreamAiGroup(group,t,roleObj)}};
  }
  const wrap=document.createElement('div');wrap.className='wx-msg me';
  const av=document.createElement('div');av.className='av';
  const me=lj('wx_me')||{};
  if(me.avatarImg)av.innerHTML=`<img src="${me.avatarImg}"/>`;else av.textContent=me.avatar||'🙂';
  const content=document.createElement('div');content.className='content';
  const segs=splitNarration(text);
  segs.forEach(seg=>{if(seg.type==='narration'){const nb=document.createElement('div');nb.className='narration-block me';nb.textContent=seg.text;content.appendChild(nb)}else{const d=document.createElement('div');d.className='b';d.textContent=seg.text;content.appendChild(d)}});
  wrap.appendChild(av);wrap.appendChild(content);db.appendChild(wrap);db.scrollTop=db.scrollHeight;return wrap;
}
function renderDreamAiGroup(group,text,roleObj){
  group.innerHTML='';
  const bubbles=splitMultiBubble(text);
  bubbles.forEach((btext,bIdx)=>{
    const segs=splitNarration(btext);
    segs.forEach((seg,idx)=>{
      if(seg.type==='narration'){const nb=document.createElement('div');nb.className='narration-block';nb.textContent=seg.text;group.appendChild(nb)}
      else{
        const wrap=document.createElement('div');wrap.className='wx-msg ai';
        const av=document.createElement('div');av.className='av';
        if(roleObj){if(roleObj.avatarImg)av.innerHTML=`<img src="${roleObj.avatarImg}"/>`;else av.textContent=roleObj.avatar||'🌙'}
        const content=document.createElement('div');content.className='content';
        if(bIdx===0&&idx===0){const nm=document.createElement('div');nm.className='name';nm.textContent=roleObj?roleObj.name:'';content.appendChild(nm)}
        const b=document.createElement('div');b.className='b';b.textContent=seg.text;

function sendDream(id){

function finishDream(id,mode){
  closeModal();

  toast('整理梦境中...');
  const dialog=hist.map(m=>(m.role==='ai'?r.name:'我')+': '+m.text).join('\n');
  const setup=r.dreamSetup||{};const scene=setup.customScene||setup.scene||'';
  const sys='你是梦境记录者。把这段梦境对话写成一篇第一人称的梦境日记。300-600字。';
  callAI(sys,[{role:'user',content:'梦境对话：\n'+dialog+'\n\n请写成梦境日记。'}],API.temp).then(text=>{
    const h=getDreamHistory(id);
    h.unshift({time:Date.now(),diary:text,scene,mood:setup.mood});
    if(h.length>50)h.length=50;
    saveDreamHistory(id,h);
    if(mode!=='forget'){
      const summary=text.slice(0,100).replace(/\n/g,' ');
      r.memories=r.memories||[];r.memories.unshift({text:'【梦】'+summary+'...',time:Date.now()});
      if(r.memories.length>30)r.memories.length=30;
      saveRoles();
    }
    ls('wx_dream_'+id,'[]');
    wxNav=wxNav.filter(v=>v.view!=='dream'&&v.view!=='dreamSetup');
    if(!wxNav.length)wxNav=[{view:'main'}];
    wxRender();toast('已记录 ✓');

    toast('整理失败：'+e.message);ls('wx_dream_'+id,'[]');
    wxNav=wxNav.filter(v=>v.view!=='dream'&&v.view!=='dreamSetup');
    if(!wxNav.length)wxNav=[{view:'main'}];
    wxRender();
  });

        <div style="font-size:12px;color:#8e8e93;margin-top:4px">${rp.hisIdentity?esc(rp.hisIdentity+' × '+rp.yourIdentity):'未设定身份'}</div></div>
        <div class="rt">›</div>
      </div>`).join(''):'<div style="text-align:center;padding:60px 20px;color:#999">还没有创建世界</div>'}
    <button class="btn f" style="margin:20px 16px;width:calc(100% - 32px)" onclick="openRpEditor('${roleId}',null)">＋ 新建角色扮演</button>`;
}
function openRpChat(roleId,rpId){wxNav.push({view:'rpChat',id:roleId,rpId});wxRender()}
function renderRpChatView(roleId,rpId){
  const r=getRole(roleId);
  const rp=(r.rps||[]).find(x=>x.id===rpId);
  if(!rp){toast('世界不存在');wxNav.pop();wxRender();return}
  setTop(r.remark||r.name+' · '+(rp.sceneName||'角色扮演'),true,'⋯',()=>openRpMenu(roleId,rpId));
  const b=$('appB');
  b.style.display='flex';b.style.flexDirection='column';b.style.overflowY='hidden';b.style.padding='0';
  b.innerHTML=`<div class="wx-chat roleplay">
    <div class="wx-chat-body" id="rpcb"></div>
    <div class="wx-chat-input">
      <button class="btn-circle plus" onclick="openRpPlus('${roleId}','${rpId}')">＋</button>
      <textarea id="rpi" rows="1" placeholder="说点什么..."></textarea>
      <button class="send" onclick="sendRpChat('${roleId}','${rpId}')">发送</button>
    </div>
  </div>`;
  applyTheme($('.wx-chat'),'roleplay');
  refreshRpChat(roleId,rpId);
  bindInputAutoGrow($('rpi'),'rp');
}
function refreshRpChat(roleId,rpId){
  const cb=$('rpcb');if(!cb)return;cb.innerHTML='';
  const hist=getRpChat(rpId);const r=getRole(roleId);
  const rp=(r.rps||[]).find(x=>x.id===rpId);
  if(!hist.length){
    const greet=rp.opening||`（${rp.sceneName}，${rp.hisIdentity||r.name}看向你）`;
    const gm={role:'ai',text:greet,time:Date.now(),read:true,id:uid('m')};
    hist.push(gm);saveRpChat(rpId,hist);
  }
  let lastT=0;
  hist.forEach(m=>{
    if(!lastT||(m.time-lastT)>5*60*1000){const d=document.createElement('div');d.className='time-sep';d.textContent=fmtMsgTime(m.time);cb.appendChild(d)}
    lastT=m.time||0;
    addRpMsg(roleId,rpId,m.role,m.text,m.role==='ai'?r:null,m);
  });
  cb.scrollTop=cb.scrollHeight;
}
function addRpMsg(roleId,rpId,role,text,roleObj,msgObj){
  const cb=$('rpcb');if(!cb)return null;
  if(role==='ai'){
    const group=document.createElement('div');group.className='ai-group';
    renderRpAiGroup(group,text,roleObj);
    cb.appendChild(group);cb.scrollTop=cb.scrollHeight;
    return {group,setText:(t)=>{renderRpAiGroup(group,t,roleObj)}};
  }
  const wrap=document.createElement('div');wrap.className='wx-msg me';
  const av=document.createElement('div');av.className='av';
  const me=lj('wx_me')||{};
  if(me.avatarImg)av.innerHTML=`<img src="${me.avatarImg}"/>`;else av.textContent=me.avatar||'🙂';
  const content=document.createElement('div');content.className='content';
  const segs=splitNarration(text);
  segs.forEach(seg=>{if(seg.type==='narration'){const nb=document.createElement('div');nb.className='narration-block me';nb.textContent=seg.text;content.appendChild(nb)}else{const d=document.createElement('div');d.className='b';d.textContent=seg.text;content.appendChild(d)}});
  wrap.appendChild(av);wrap.appendChild(content);cb.appendChild(wrap);cb.scrollTop=cb.scrollHeight;return wrap;
}
function renderRpAiGroup(group,text,roleObj){
  group.innerHTML='';
  const bubbles=splitMultiBubble(text);
  bubbles.forEach((btext,bIdx)=>{
    const segs=splitNarration(btext);
    segs.forEach((seg,idx)=>{
      if(seg.type==='narration'){const nb=document.createElement('div');nb.className='narration-block';nb.textContent=seg.text;group.appendChild(nb)}
      else{
        const wrap=document.createElement('div');wrap.className='wx-msg ai';
        const av=document.createElement('div');av.className='av';
        if(roleObj){if(roleObj.avatarImg)av.innerHTML=`<img src="${roleObj.avatarImg}"/>`;else av.textContent=roleObj.avatar||'🎭'}
        const content=document.createElement('div');content.className='content';
        if(bIdx===0&&idx===0){const nm=document.createElement('div');nm.className='name';nm.textContent=roleObj?roleObj.name:'';content.appendChild(nm)}
        const b=document.createElement('div');b.className='b';b.textContent=seg.text;
        content.appendChild(b);wrap.appendChild(av);wrap.appendChild(content);group.appendChild(wrap);
      }
    });
  });
}
function sendRpChat(roleId,rpId){
  const inp=$('rpi');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  if(!API.url||!API.key){toast('请先到设置配置 API');return}
  const r=getRole(roleId);const rp=(r.rps||[]).find(x=>x.id===rpId);if(!rp)return;
  const hist=getRpChat(rpId);
  const um={role:'user',text,time:Date.now(),read:true,id:uid('m')};
  hist.push(um);saveRpChat(rpId,hist);
  addRpMsg(roleId,rpId,'user',text,null,um);
  inp.value='';inp.style.height='auto';
  autoReplyRp(roleId,rpId);
}
function autoReplyRp(roleId,rpId){
  const r=getRole(roleId);const rp=(r.rps||[]).find(x=>x.id===rpId);if(!rp)return;
  const hist=getRpChat(rpId);
  const tmp={role:'ai',text:'...',time:Date.now(),read:false,id:'tmp_'+Date.now()};
  const handle=addRpMsg(roleId,rpId,'ai','...',r,tmp);
  const el=handle.group?handle.group:handle;
  const msgs=hist.slice(-16).map(x=>({role:x.role==='ai'?'assistant':'user',content:x.text}));
  callAI(buildRpPrompt(r,rp,null),msgs,API.temp,(d,full)=>{renderRpAiGroup(el,full,r);const cb=$('rpcb');if(cb)cb.scrollTop=cb.scrollHeight}).then(res=>{
    const final=String(res||'').trim()||'（沉默）';
    hist.push({role:'ai',text:final,time:Date.now(),read:false,id:uid('m')});
    saveRpChat(rpId,hist);renderRpAiGroup(el,final,r);
  }).catch(e=>{el.innerHTML=`<div style="padding:8px;color:#ff3b30">失败：${esc(e.message)}</div>`});
}
function openRpPlus(roleId,rpId){
  const bg=document.createElement('div');bg.className='mask-bg';bg.onclick=()=>closePlus();
  document.body.appendChild(bg);
  const panel=document.createElement('div');panel.className='plus-panel';
  panel.style.gridTemplateColumns='repeat(2,1fr)';
  panel.innerHTML=`<div class="pi" onclick="closePlus();openRpEditor('${roleId}','${rpId}')"><div class="ic">✏️</div><div class="nm">编辑世界</div></div>
    <div class="pi" onclick="closePlus();openRpMemory('${roleId}','${rpId}')"><div class="ic">💭</div><div class="nm">记忆</div></div>`;
  document.body.appendChild(panel);
}
function openRpMenu(roleId,rpId){
  showLongMenu(window.innerWidth-200,80,[
    {ic:'✏️',t:'编辑世界设定',f:()=>openRpEditor(roleId,rpId)},
    {ic:'💭',t:'记忆管理',f:()=>openRpMemory(roleId,rpId)},
    {ic:'🗑',t:'删除这个世界',f:()=>{const r=getRole(roleId);const rp=(r.rps||[]).find(x=>x.id===rpId);if(!confirm('删除「'+rp.sceneName+'」？'))return;r.rps=r.rps.filter(x=>x.id!==rpId);saveRoles();localStorage.removeItem('wx_rp_chat_'+rpId);wxNav.pop();wxRender();toast('已删除')}}
  ]);
}
function openRpEditor(roleId,rpId){
  const r=getRole(roleId);
  let rp,isNew=false;
  if(rpId){rp=(r.rps||[]).find(x=>x.id===rpId);if(!rp)return}
  else{isNew=true;rp={id:uid('rp'),sceneName:'',hisIdentity:'',yourIdentity:'',relation:'',world:'',plot:'',rules:'',opening:'',memories:[],customFields:[],note:''}}
  mkModal(isNew?'新建角色扮演':'编辑世界',
  `<div class="fld"><label>场景名</label><input id="_rpn" value="${esc(rp.sceneName||'')}"/></div>
   <div class="fld"><label>世界观</label><textarea id="_rpw">${esc(rp.world||'')}</textarea></div>
   <div class="fld"><label>他的身份</label><input id="_rphi" value="${esc(rp.hisIdentity||'')}"/></div>
   <div class="fld"><label>你的身份</label><input id="_rpyi" value="${esc(rp.yourIdentity||'')}"/></div>
   <div class="fld"><label>关系</label><input id="_rpr" value="${esc(rp.relation||'')}"/></div>
   <div class="fld"><label>当前剧情</label><textarea id="_rpplot">${esc(rp.plot||'')}</textarea></div>
   <div class="fld"><label>世界规则</label><textarea id="_rprules">${esc(rp.rules||'')}</textarea></div>
   <div class="fld"><label>开场白</label><textarea id="_rpo">${esc(rp.opening||'')}</textarea></div>`,
  [{t:isNew?'创建':'保存',f:()=>{
    const sceneName=$('_rpn').value.trim();
    if(!sceneName){toast('请输入场景名');return}
    rp.sceneName=sceneName;
    rp.hisIdentity=$('_rphi').value.trim();
    rp.yourIdentity=$('_rpyi').value.trim();
    rp.relation=$('_rpr').value.trim();
    rp.world=$('_rpw').value.trim();
    rp.plot=$('_rpplot')?$('_rpplot').value.trim():'';
    rp.rules=$('_rprules')?$('_rprules').value.trim():'';
    rp.opening=$('_rpo').value.trim();
    if(isNew){r.rps=r.rps||[];r.rps.push(rp);saveRoles();closeModal();wxNav.pop();wxNav.push({view:'rpChat',id:roleId,rpId:rp.id});wxRender()}
    else{saveRoles();closeModal();refreshRpChat(roleId,rp.id);toast('已保存')}
  }},{t:'取消',g:1,f:closeModal}]);
}
function openRpMemory(roleId,rpId){
  const r=getRole(roleId);
  const rp=(r.rps||[]).find(x=>x.id===rpId);if(!rp)return;
  mkModal('记忆 · '+esc(rp.sceneName),
  `<div class="fld"><label>添加记忆</label><input id="_rpmt"/></div>
   <div style="max-height:300px;overflow-y:auto">${(rp.memories||[]).map((m,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;flex:1;word-break:break-word">${esc(m.text)}</span><span style="color:#ff3b30;cursor:pointer;margin-left:8px" onclick="delRpMem('${roleId}','${rpId}',${i})">✕</span></div>`).join('')||'<div style="text-align:center;color:#8e8e93;padding:20px">暂无记忆</div>'}</div>`,
  [{t:'添加',f:()=>{const v=$('_rpmt').value.trim();if(!v)return;rp.memories=rp.memories||[];rp.memories.unshift({text:v,time:Date.now()});saveRoles();closeModal();openRpMemory(roleId,rpId)}},{t:'关闭',g:1,f:closeModal}]);
}
function delRpMem(roleId,rpId,i){
  const r=getRole(roleId);const rp=(r.rps||[]).find(x=>x.id===rpId);if(!rp)return;
  rp.memories.splice(i,1);saveRoles();closeModal();openRpMemory(roleId,rpId);
}
/* ============ 主动消息 ============ */
setInterval(()=>{checkProactive();checkMomentProactive()},60000);
setTimeout(()=>{checkProactive();checkMomentProactive()},5000);
function checkProactive(){
  if(!API.url||!API.key)return;
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  roles.forEach(r=>{
    const p=r.proactive;if(!p||!p.enabled)return;
    if(!inActiveTime(nowMin,p))return;
    const interval=(p.interval||60)*60*1000;
    const last=parseInt(ls('wx_proactive_last_'+r.id)||'0');
    if(Date.now()-last<interval)return;
    ls('wx_proactive_last_'+r.id,String(Date.now()));
    const types=p.types||['问候'];
    const pick=types[Math.floor(Math.random()*types.length)];
    genProactiveWX(r,pick);
  });
}
function inActiveTime(nowMin,p){
  const [sh,sm]=(p.activeStart||'08:00').split(':').map(Number);
  const [eh,em]=(p.activeEnd||'23:00').split(':').map(Number);
  const sMin=sh*60+(sm||0),eMin=eh*60+(em||0);
  if(sMin<=eMin)return nowMin>=sMin&&nowMin<=eMin;
  return nowMin>=sMin||nowMin<=eMin;
}
function genProactiveWX(r,type){
  const hints={'问候':'发一句自然的问候','分享心情':'分享你现在的心情','撒娇':'用撒娇的语气说一句','报备行程':'告诉用户你现在要去哪','发照片':'描述你拍了一张照片发给用户','想你了':'直接说想用户'};
  const hint=hints[type]||'主动发一条自然的消息';
  const sys=buildPrompt(r,`现在主动给用户发一条简短消息（20字内）。要求：${hint}。`,'online');
  callAI(sys,[{role:'user',content:'（主动发消息）'}],API.tempOnline).then(reply=>{
    let clean=stripAction(reply).trim();if(!clean)return;
    const h1=getChatOnline(r.id);const h2=getChatOffline(r.id);
    const last1=h1[h1.length-1]?.time||0;const last2=h2[h2.length-1]?.time||0;
    const mode=last2>last1?'offline':'online';
    const hist=mode==='offline'?h2:h1;
    hist.push({role:'ai',text:clean,time:Date.now(),read:false,id:uid('m')});
    if(mode==='offline')saveChatOffline(r.id,hist);else saveChatOnline(r.id,hist);
    const top=wxNav[wxNav.length-1];
    if(top&&top.view==='chat'&&top.id===r.id&&(top.mode||'online')===mode){refreshChat();markRead(r.id)}
    sendSystemNotification(r,clean);
  }).catch(()=>{});
}
